<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9f3ee"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="300" y1="330" x2="640" y2="800">
      <stop offset="0" stop-color="#7fe8b8"/>
      <stop offset="0.35" stop-color="#2fb87b"/>
      <stop offset="0.7" stop-color="#1f9a65"/>
      <stop offset="1" stop-color="#145f42"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9e6df"/><stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f4faf7"/><stop offset="1" stop-color="#b9cdc3"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb87b"/><stop offset="1" stop-color="#145f42"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d3f5e3"/><stop offset="1" stop-color="#2fb87b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#082a1e" flood-opacity=".35"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="cloudClip">
      <g><circle cx="360" cy="600" r="150"/><circle cx="560" cy="520" r="200"/><circle cx="716" cy="620" r="120"/>
      <rect x="190" y="600" width="650" height="190" rx="95"/></g>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="900" rx="330" ry="40" fill="#2fb87b" opacity=".12" filter="url(#soft)"/>
  <!-- cloud -->
  <g filter="url(#shadow)">
    <g fill="url(#metal)"><circle cx="360" cy="600" r="150"/><circle cx="560" cy="520" r="200"/><circle cx="716" cy="620" r="120"/>
    <rect x="190" y="600" width="650" height="190" rx="95"/></g>
  </g>
  <g clip-path="url(#cloudClip)">
    <ellipse cx="560" cy="360" rx="330" ry="150" fill="url(#gloss)" opacity=".55"/>
    <rect x="190" y="745" width="650" height="6" fill="#d3f5e3" opacity=".35"/>
  </g>
  <!-- rocket -->
  <g filter="url(#shadow)" transform="translate(512 0)">
    <ellipse cx="0" cy="780" rx="70" ry="95" fill="url(#glow)" opacity=".9"/>
    <path d="M0 800 C-34 760 -30 724 0 690 C30 724 34 760 0 800Z" fill="#8ff0c2"/>
    <path d="M-62 560 L-138 650 L-138 700 L-62 650Z" fill="url(#fin)"/>
    <path d="M62 560 L138 650 L138 700 L62 650Z" fill="url(#fin)"/>
    <path d="M0 150 C100 250 118 440 78 700 L-78 700 C-118 440 -100 250 0 150Z" fill="url(#rocket)"/>
    <path d="M0 150 C42 192 66 232 80 280 L-80 280 C-66 232 -42 192 0 150Z" fill="url(#fin)"/>
    <circle cx="0" cy="420" r="52" fill="#145f42"/>
    <circle cx="0" cy="420" r="40" fill="url(#metal)"/>
    <ellipse cx="-12" cy="402" rx="18" ry="11" fill="#fff" opacity=".6" transform="rotate(-30 -12 402)"/>
    <rect x="-79" y="618" width="158" height="10" fill="#2fb87b" opacity=".9"/>
  </g>
  <rect x="2" y="2" width="1020" height="1020" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
</svg>
